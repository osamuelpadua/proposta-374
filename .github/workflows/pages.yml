name: Publicar propostas atuais

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar somente as propostas 377 e 378
        run: |
          mkdir -p _site/377 _site/378
          cp index.html _site/index.html
          cp 377/index.html 377/styles.css 377/logo.svg 377/Proposta-377-GIO-Rudge-Ramos.pdf _site/377/
          cp 378/index.html 378/styles.css 378/logo.svg 378/logo-icon.svg 378/og.png _site/378/

      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
